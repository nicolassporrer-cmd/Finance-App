name: Daily refresh

# Re-runs the whole pipeline and commits the derived JSON.
#
# SEC_USER_AGENT is REQUIRED: www.sec.gov answers 403 to any request without a
# declared "AppName contact@email" user agent, on the very first call. The job
# fails loudly if it is absent rather than committing an empty dataset.
#
# FINNHUB_API_KEY is optional — without it the consensus step writes an empty
# file and everything else still runs.
on:
  schedule:
    - cron: '25 7 * * *'      # 07:25 UTC daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Require the SEC user agent
        run: |
          if [ -z "$SEC_USER_AGENT" ]; then
            echo "::error::SEC_USER_AGENT is not set. Add it under Settings > Secrets and variables > Actions."
            echo "Expected form: Finance-App you@example.com"
            exit 1
          fi
          case "$SEC_USER_AGENT" in
            *@*) echo "SEC user agent is set." ;;
            *) echo "::error::SEC_USER_AGENT has no email address in it; SEC will return 403."; exit 1 ;;
          esac

      - name: Refresh the S&P 500 constituent list
        run: node scripts/fetch-universe.cjs

      - name: Index filings
        run: node scripts/fetch-filings.cjs

      # Nothing is cached between runs, so this re-downloads every document. Pair
      # mode fetches only the two filings a single comparison needs — roughly
      # 1,000 documents instead of the 3,000 a full sweep would pull.
      - name: Extract sections
        env:
          PAIR_MODE: '1'
        run: node scripts/extract-sections.cjs

      - name: Diff sections against the prior filing
        run: node scripts/diff-sections.cjs

      - name: Fetch financials from XBRL
        run: node scripts/fetch-financials.cjs

      - name: Fetch share prices
        run: node scripts/fetch-prices.cjs

      - name: Warn if the Finnhub key is absent
        if: env.FINNHUB_API_KEY == ''
        run: echo "::warning::FINNHUB_API_KEY is not set — analyst consensus will be empty."

      - name: Fetch analyst consensus
        run: node scripts/fetch-consensus.cjs

      - name: Assemble the page payload
        run: node scripts/build-payload.cjs

      - name: Commit if anything changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/ && git diff --quiet --cached -- data/; then
            echo "Nothing changed today."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          SUMMARY=$(node -e "
            const p=require('./data/payload.json');
            console.log(p.totals.companies+' companies, '+p.totals.withFinancials+' with financials, '
              +p.totals.comparisons+' comparisons');
          ")
          git add data/
          git commit -m "Daily refresh: $SUMMARY"
          git push

  # A push made with GITHUB_TOKEN does not trigger other workflows, so the refresh
  # must publish its own commit. Without this the data updates in the repo and the
  # live site silently never changes.
  publish:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
